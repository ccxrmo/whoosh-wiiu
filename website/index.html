<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Whoosh</title>
        <link rel="stylesheet" href="style.css">

        <script src="script.js"></script>
    </head>


    <body>
        <div>
        <nav>
            <ul>

                <li>
                    <a href="#" tabindex="0">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">Search</span>
                                <span class="material-symbols-outlined">search</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">Feed</span>
                                <span class="material-symbols-outlined">article</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">Profile</span>
                                <span class="material-symbols-outlined">person</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">Settings</span>
                                <span class="material-symbols-outlined">settings</span>
                            </span>
                        </span>
                    </a>
                </li>
            </ul>
        </nav>
<br>
        <nav>
            <ul>
                <li>
                    <a href="#" tabindex="0">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">Post</span>
                                <span class="material-symbols-outlined">stylus_note</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">Notifications</span>
                                <span class="material-symbols-outlined">notifications</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <button id="toggle" type="button" aria-pressed="false" onclick="checkBoxClicked()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">Sounds On</span>
                                <span class="material-symbols-outlined" aria-hidden="true">check_box_outline_blank</span>
                            </span>
                        </span>
                    </button>
                </li>
            </ul>
        </nav>
        </div>
    </body>
</html>
