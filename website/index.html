<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Whoosh</title>
        <link rel="stylesheet" href="style.css">

        <script src="script.js"></script>
    </head>


    <body>
        <div class="container">
        <nav>
            <ul>

                <li>
                    <button id="search-button" type="button" onclick="toggleSearchScreen();">
                        <span class="tile-label">SEARCH</span>
                        <span class="material-icons" aria-hidden="true">&#xe8b6;</span>
                        <span class="description">Search for content.</span>
                    </button>
                </li>

                <li>
                    <button id="library-button" type="button" onclick="notImplementedPopup();">
                        <span class="tile-label">FEED</span>
                        <span class="material-icons" aria-hidden="true">&#xe02f;</span>
                        <span class="description">View what's going on.</span>
                    </button>
                </li>

                <li>
                    <button id="profile-button" type="button" onclick="notImplementedPopup();">
                        <span class="tile-label">PROFILE</span>
                        <span class="material-icons" aria-hidden="true">&#xe7fd;</span>
                        <span class="description">View your profile.</span>
                    </button>
                </li>

                <li>
                    <button id="settings-button" type="button" onclick="openSettings();">
                        <span class="tile-label">SETTINGS</span>
                        <span class="material-icons" aria-hidden="true">&#xe8b8;</span>
                        <span class="description">Change global settings of the app.</span>
                    </button>
                </li>

                <li>
                    <button id="toggle" type="button" aria-pressed="false" onclick="checkBoxClicked();">
                        <span class="tile-label">SOUNDS ON</span>
                        <span class="material-icons" aria-hidden="true">&#xe835;</span>
                        <span class="description">Toggle sound effects on or off.</span>
                    </button>
                </li>

            </ul>
        </nav>

        <div class="sections">
            <section id="search-screen">
                <h2>Search</h2>
                <input id="search-query" type="search" placeholder="Write here..."> <br>
                <button id="search-close-button" type="button" onclick="closeSearchScreen();">Close</button>
            </section>

            <section id="settings-screen">
                <h2>Settings</h2>
                <h3>SpotPass Notifications</h3>
                <input type="button" id="spotpass-toggle" value="SpotPass Not Enabled" onclick="SpotPassTogglePopup();">
        </div>
    </body>
</html>
