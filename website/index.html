<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Whoosh</title>
        <link rel="stylesheet" href="style.css">

        <script src="script.js"></script>
    </head>


    <body>
        <div>
        <nav>
            <ul>

                <li>
                    <a href="#" tabindex="0" id="menu-button" onclick="pressedSound()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">SEARCH</span>
                                <span class="material-icons">&#xe8b6;</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0" id="menu-button" onclick="pressedSound()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">FEED</span>
                                <span class="material-icons">&#xef42;</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0" id="menu-button" onclick="pressedSound()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">PROFILE</span>
                                <span class="material-icons">&#xe7fd;</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0" id="menu-button" onclick="pressedSound(); openSettings()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">SETTINGS</span>
                                <span class="material-icons">&#xe8b8;</span>
                            </span>
                        </span>
                    </a>
                </li>
        
                <li>
                    <a href="#" tabindex="0" id="menu-button" onclick="pressedSound()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">POST</span>
                                <span class="material-icons">&#xe3c9;</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#" tabindex="0" id="menu-button" onclick="pressedSound()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">NOTIFICATIONS</span>
                                <span class="material-icons">&#xe7f4;</span>
                            </span>
                        </span>
                    </a>
                </li>

                <li>
                    <button id="toggle" type="button" aria-pressed="false" onclick="checkBoxClicked(); pressedSound()">
                        <span class="tile-content">
                            <span class="tile-content-inner">
                                <span class="tile-label">SOUNDS ON</span>
                                <span class="material-icons" aria-hidden="true">&#xe835;</span>
                            </span>
                        </span>
                    </button>
                </li>
            </ul>
        </nav>

        <main>
            <div id="settings">
                <h2>SETTINGS</h2>
                <div class="settings-content">
                <h3>Theme</h3>
                <input type="radio" name="theme" value="light"> Light Theme <br>
                <input type="radio" name="theme" value="dark" checked> Dark Theme <br><br><br>
                <input type="button" value="Close" onclick="closeSettings(); pressedSound();">
                </div>
            </div>
        </main>
        </div>
    </body>
</html>
